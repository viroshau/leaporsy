<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGA JEOPARDY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik+Mono+One&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-noise"></div>
  <div class="bg-orbs" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <header class="marquee-frame">
    <div class="marquee-bulbs" aria-hidden="true"></div>
    <h1 id="game-title" class="game-title">MEGA JEOPARDY</h1>
    <div class="marquee-bulbs bottom" aria-hidden="true"></div>
  </header>

  <main>
    <section id="board" class="board" aria-label="Game board"></section>

    <section class="scoreboard-wrap">
      <div class="scoreboard-header">
        <h2 class="scoreboard-title">★ SCOREBOARD ★</h2>
        <div class="scoreboard-actions">
          <button id="add-team-btn" class="btn btn-add">+ NEW TEAM</button>
          <button id="reset-btn" class="btn btn-reset">↺ RESET GAME</button>
        </div>
      </div>
      <div id="teams" class="teams"></div>
    </section>
  </main>

  <footer class="app-footer">
    <button id="debug-btn" class="btn btn-debug" title="Host preview: reveal every question &amp; answer on the board">
      🐛 DEBUG: SHOW ALL CLUES
    </button>
  </footer>

  <!-- Clue modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
      <div class="modal-header">
        <span id="modal-category" class="modal-category"></span>
        <span id="modal-points" class="modal-points"></span>
      </div>
      <div class="modal-body">
        <img id="modal-image" class="modal-image hidden" alt="Picture clue">
        <p id="modal-question" class="modal-question"></p>
        <div id="modal-answer" class="modal-answer hidden">
          <span class="answer-label">ANSWER</span>
          <p id="modal-answer-text"></p>
          <img id="modal-answer-image" class="modal-image hidden" alt="Answer picture">
        </div>
      </div>
      <button id="reveal-btn" class="btn btn-reveal">👁 REVEAL ANSWER</button>
      <div id="award-panel" class="award-panel hidden">
        <p class="award-hint">Award (or deduct) points:</p>
        <div id="award-teams" class="award-teams"></div>
        <button id="no-award-btn" class="btn btn-ghost">NOBODY GOT IT →</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
