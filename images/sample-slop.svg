    <rect x="474" y="301" width="21" height="6" rx="3" transform="rotate(32 474 304)"/>
    <rect x="470" y="308" width="19" height="6" rx="3" transform="rotate(44 470 311)"/>
    <rect x="466" y="314" width="17" height="6" rx="3" transform="rotate(56 466 317)"/>
